<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Truck-kun Tower</title>
  <meta name="description" content="Меня сбил грузовик, и я переродился башней в мире слизней и теперь мне нужно вести себя как веб-приложение, созданное ради выполнения домашки">
  <link rel="canonical" href="https://tower.rokokol.art:8443/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Truck-kun Tower">
  <meta property="og:description" content="Меня сбил грузовик, и я переродился башней в мире слизней и теперь мне нужно вести себя как веб-приложение, созданное ради выполнения домашки">
  <meta property="og:image" content="https://tower.rokokol.art:8443/og.png">
  <meta property="og:url" content="https://tower.rokokol.art:8443/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Truck-kun Tower">
  <meta name="twitter:description" content="Меня сбил грузовик, и я переродился башней в мире слизней и теперь мне нужно вести себя как веб-приложение, созданное ради выполнения домашки">
  <meta name="twitter:image" content="https://tower.rokokol.art:8443/og.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    const towerThemeKey = 'truck-kun-tower:theme';
    try {
      const mode = localStorage.getItem(towerThemeKey);
      if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
    } catch {}
  </script>
  <link rel="stylesheet" href="vendor/ddlc/ddlc-ui.css">
  <link rel="stylesheet" href="duel.css?v=@hash@">
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/" data-i18n-aria-label="homeLink">
        <svg class="brand-mark" viewBox="0 0 58 46" aria-hidden="true"><use href="actors.svg#emblem"/></svg>
        <span class="brand-word"><b>Truck<span>-kun</span></b><em>Tower</em></span>
      </a>
      <div class="header-tools">
        <button class="header-control" id="sound" type="button" disabled data-i18n-aria-label="sound">
          <span class="sound-mark" data-state="unavailable" aria-hidden="true"></span>
          <span id="sound-label"></span>
        </button>
        <div class="language" role="group" data-i18n-aria-label="language">
          <button class="header-control" type="button" data-language="ru" lang="ru">RU</button>
          <button class="header-control" type="button" data-language="en" lang="en">EN</button>
        </div>
        <button class="header-control" id="theme" type="button" disabled>
          <svg viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><path id="theme-icon"/></svg>
        </button>
        <a class="header-control" href="https://github.com/rokokol/truck-kun-tower" target="_blank" rel="noopener noreferrer"
           data-i18n-aria-label="github" data-i18n-title="github">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </header>

    <!-- The two paper screens. Alpine owns them, the board below belongs to game.js -->
    <div id="app" x-data="tower" x-cloak x-show="screen === 'auth' || screen === 'lobby'">
      <section id="auth" class="card" x-show="screen === 'auth'" aria-labelledby="authTitle">
        <span class="ribbon" x-text="t('login')"></span>
        <svg class="plate" viewBox="0 0 300 124" aria-hidden="true">
          <path class="plate-road" d="M10 104H290"/>
          <g class="plate-speed"><path d="M18 74h18M8 86h26M22 98h16"/></g>
          <use href="actors.svg#truck" x="24" y="40" width="96" height="88"/>
          <use href="actors.svg#keep" x="192" y="16" width="72" height="101"/>
          <use href="actors.svg#giant" x="152" y="76" width="34" height="34"/>
          <use href="actors.svg#swarm" x="136" y="90" width="19" height="19"/>
          <use href="actors.svg#swarm" x="118" y="97" width="14" height="14"/>
          <g class="plate-burst"><path d="m172 44 3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="m188 66 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>
        </svg>
        <h1 id="authTitle" x-text="t('authTitle')"></h1>
        <p class="lede" x-text="t('lede')"></p>
        <small class="kicker" x-text="t('kicker')"></small>

        <div class="tabs" role="tablist" :aria-label="t('authTabs')">
          <button type="button" role="tab" id="tabLogin" aria-controls="authForm"
                  :aria-selected="mode === 'login'" :class="{ on: mode === 'login' }"
                  @click="mode = 'login'; error = ''" x-text="t('login')"></button>
          <button type="button" role="tab" id="tabRegister" aria-controls="authForm"
                  :aria-selected="mode === 'register'" :class="{ on: mode === 'register' }"
                  @click="mode = 'register'; error = ''" x-text="t('register')"></button>
        </div>

        <form id="authForm" class="fields" role="tabpanel"
              :aria-labelledby="mode === 'login' ? 'tabLogin' : 'tabRegister'"
              @submit.prevent="submitAuth()">
          <label for="nick" x-text="t('nickname')"></label>
          <input id="nick" name="nickname" x-model.trim="nickname" autocomplete="username"
                 required minlength="3" maxlength="24" spellcheck="false"
                 :aria-invalid="error ? 'true' : null" :aria-describedby="error ? 'authError' : null">
          <label for="pass" x-text="t('password')"></label>
          <input id="pass" name="password" type="password" x-model="password"
                 :autocomplete="mode === 'login' ? 'current-password' : 'new-password'"
                 required minlength="8" maxlength="72"
                 :aria-describedby="error ? 'passRule authError' : 'passRule'"
                 :aria-invalid="error ? 'true' : null">
          <small id="passRule" class="rule" x-text="t('passwordRule')"></small>
          <button type="submit" class="wide" :disabled="busy"
                  x-text="t(busy ? 'busy' : mode === 'login' ? 'signIn' : 'signUp')"></button>
        </form>
        <p id="authError" class="error-slip form-error" role="alert" x-show="error">
          <span class="error-slip-heading" x-text="t('errorHeading')"></span>
          <span x-text="text(error)"></span>
        </p>

        <p class="or"><span x-text="t('or')"></span></p>

        <button id="start" type="button" @click="playGuest()" :disabled="busy"
                x-text="t(pendingRoom ? 'join' : 'guest')"></button>
        <p class="fine" x-show="pendingRoom" x-text="t('pendingRoom', { room: pendingRoom })"></p>
        <fieldset class="sides" x-show="pendingRoom">
          <legend x-text="t('side')"></legend>
          <label><input type="radio" name="guestSide" value="defender" x-model="side"> <span x-text="t('defender')"></span></label>
          <label><input type="radio" name="guestSide" value="attacker" x-model="side"> <span x-text="t('attacker')"></span></label>
        </fieldset>

        <ul class="badges"><li>1 × 1</li><li x-text="t('fiveWaves')"></li><li x-text="t('withSound')"></li></ul>
      </section>

      <section id="lobby" class="screen" x-show="screen === 'lobby'" aria-labelledby="lobbyTitle">
        <h1 id="lobbyTitle" class="screen-title" x-text="t('lobby')"></h1>

        <div class="card profile">
          <small class="cap" x-text="t('profile')"></small>
          <p class="who"><b x-text="user ? user.nickname : ''"></b>
            <span class="presence on" aria-hidden="true"></span></p>
          <p class="fine"><span x-text="t('joinedSince')"></span> <time :datetime="user ? user.createdAt : null" x-text="joinedLabel"></time></p>
          <button type="button" @click="logout()" x-text="t('logout')"></button>
        </div>

        <p class="notice" role="status" x-show="note" x-text="text(note)"></p>
        <p class="error-slip form-error" role="alert" x-show="lobbyError">
          <span class="error-slip-heading" x-text="t('errorHeading')"></span>
          <span x-text="text(lobbyError)"></span>
        </p>

        <div class="card">
          <small class="cap" x-text="t('friends')"></small>
          <form class="inline-form" @submit.prevent="addFriend()">
            <label for="friendNick" x-text="t('addFriend')"></label>
            <div class="row">
              <input id="friendNick" x-model.trim="friendNick" maxlength="24" spellcheck="false"
                     autocomplete="off" :placeholder="t('nickname')">
              <button type="submit" :disabled="busy || !friendNick" x-text="t('add')"></button>
            </div>
          </form>
          <ul class="people" x-show="friends.length">
            <template x-for="friend in friends" :key="friend.id">
              <li class="person">
                <span class="presence" :class="{ on: friend.online }"
                      :title="t(friend.online ? 'online' : 'offline')"></span>
                <b x-text="friend.nickname"></b>
                <span class="row-actions">
                  <button type="button" @click="inviteFriend(friend)" :disabled="busy" x-text="t('inviteFriend')"></button>
                  <button type="button" class="ghost" @click="removeFriend(friend)" x-text="t('remove')"></button>
                </span>
              </li>
            </template>
          </ul>
          <p class="empty" x-show="!friends.length" x-text="t('emptyFriends')"></p>
        </div>

        <div class="card" x-show="incoming.length || outgoing.length">
          <small class="cap" x-text="t('friendRequests')"></small>
          <ul class="people">
            <template x-for="row in incoming" :key="'in-' + row.id">
              <li class="person">
                <span x-text="row.from ? row.from.nickname : ''"></span>
                <span class="row-actions">
                  <button type="button" @click="answerRequest(row.id, true)" x-text="t('accept')"></button>
                  <button type="button" class="ghost" @click="answerRequest(row.id, false)" x-text="t('decline')"></button>
                </span>
              </li>
            </template>
            <template x-for="row in outgoing" :key="'out-' + row.id">
              <li class="person">
                <span x-text="row.to ? row.to.nickname : ''"></span>
                <span class="row-actions">
                  <small class="tag" x-text="t('awaitingAnswer')"></small>
                  <button type="button" class="ghost" @click="answerRequest(row.id, false)" x-text="t('cancel')"></button>
                </span>
              </li>
            </template>
          </ul>
        </div>

        <div class="card" x-show="invites.length">
          <small class="cap" x-text="t('invitations')"></small>
          <ul class="people">
            <template x-for="invite in invites" :key="invite.id">
              <li class="person">
                <span x-text="inviteLabel(invite)"></span>
                <span class="row-actions">
                  <button type="button" @click="acceptInvite(invite)" :disabled="busy" x-text="t('accept')"></button>
                  <button type="button" class="ghost" @click="declineInvite(invite)" x-text="t('decline')"></button>
                </span>
              </li>
            </template>
          </ul>
        </div>

        <div class="card">
          <small class="cap" x-text="t('newDuel')"></small>
          <fieldset class="sides">
            <legend x-text="t('side')"></legend>
            <label><input type="radio" name="side" value="defender" x-model="side"> <span x-text="t('defender')"></span></label>
            <label><input type="radio" name="side" value="attacker" x-model="side"> <span x-text="t('attacker')"></span></label>
          </fieldset>
          <button type="button" class="wide" @click="createDuel()" :disabled="busy" x-text="t('createDuel')"></button>
          <p class="fine" x-text="t('createHint')"></p>
        </div>

        <div class="card" x-show="duels.length">
          <small class="cap" x-text="t('myDuels')"></small>
          <ul class="people">
            <template x-for="duel in duels" :key="duel.id">
              <li class="duel">
                <span class="duel-line">
                  <b x-text="duel.opponent ? duel.opponent.nickname : t('emptySeat')"></b>
                  <small class="tag" x-text="statusOf(duel.status)"></small>
                  <small class="tag" x-text="sideOf(duel.mySide)"></small>
                </span>
                <span class="row-actions">
                  <button type="button" @click="continueDuel(duel)" x-text="t('continue')"></button>
                  <button type="button" class="ghost" @click="copyLink(duel.id)" x-text="t('link')"></button>
                  <button type="button" class="ghost" @click="cancelDuel(duel)" x-text="t('cancel')"></button>
                </span>
              </li>
            </template>
          </ul>
        </div>

        <p class="fine foot" x-text="t('tabNote')"></p>
      </section>
    </div>

    <section id="game" hidden>
      <div class="game-bar">
        <button id="leave" type="button" class="ghost"></button>
      </div>
      <details id="invite">
        <summary data-i18n="inviteOpponent"></summary>
        <input id="link" readonly data-i18n-aria-label="inviteLink">
        <button id="copy"></button>
      </details>
      <small class="game-cap"><span data-i18n="fieldLog"></span> / <span id="role"></span></small>
      <h2 id="status" aria-live="polite"></h2>
      <p id="rival" class="rival"></p>
      <span class="pips" id="pips" aria-hidden="true"></span>
      <small id="clock" class="clock" aria-live="off"></small>
      <div id="field" hidden>
        <div class="stats">
          <span class="chip"><span data-i18n="keep"></span> <svg class="icon heart" aria-hidden="true" viewBox="0 0 32 32"><use href="actors.svg#heart"/></svg><b id="hp"></b></span>
          <span class="chip gold"><span data-i18n="gold"></span> <svg class="coin" aria-hidden="true" viewBox="0 0 32 32"><use href="actors.svg#coin"/></svg><b id="budget"></b></span>
        </div>
        <div class="board-frame">
          <div class="board-scroll">
            <div id="board">
              <svg id="map" aria-hidden="true"></svg>
              <div id="cells" role="group" data-i18n-aria-label="boardCells"></div>
            </div>
          </div>
        </div>
        <p id="hint" aria-live="polite"></p>
      </div>
      <section id="planning" data-i18n-aria-label="waveOrders" hidden>
        <small data-i18n="waveOrders"></small>
        <div id="actions" role="group" data-i18n-aria-label="orderType"></div>
        <button id="commit" disabled></button>
        <ul id="orders" data-i18n-aria-label="groups" hidden></ul>
        <button id="ready" disabled></button>
      </section>
      <button id="swap" type="button" hidden data-i18n="swap"></button>
      <p id="swapWait" class="swap-note" role="status" hidden data-i18n="swapWait"></p>
      <div id="swapAsk" class="swap-ask" role="group" data-i18n-aria-label="swapAsk" hidden>
        <small data-i18n="swapAsk"></small>
        <button id="swapYes" type="button" data-i18n="accept"></button>
        <button id="swapNo" type="button" class="ghost" data-i18n="decline"></button>
      </div>
      <div class="after-match" role="group" data-i18n-aria-label="afterMatch" hidden id="afterMatch">
        <button id="rematch" type="button" data-i18n="rematch"></button>
        <button id="again" type="button" class="ghost" data-i18n="again"></button>
      </div>
    </section>

    <p id="error" class="error-slip" role="alert" hidden>
      <span class="error-slip-heading" data-i18n="errorHeading"></span>
      <span id="error-detail"></span>
    </p>
  </main>
  <script defer src="vendor/alpine/alpine.min.js"></script>
  <script src="signalr.min.js"></script>
  <script src="i18n.js?v=@hash@"></script>
  <script type="module">
    import { initTheme } from './vendor/ddlc/ddlc-theme.js?v=@hash@';

    const button = document.getElementById('theme');
    const labelTheme = mode => {
      const label = i18n.t('theme', { mode: i18n.t(`theme.${mode}`) });
      button.setAttribute('aria-label', label);
      button.title = label;
    };
    const theme = initTheme({
      button, icon: document.getElementById('theme-icon'), key: towerThemeKey, onChange: labelTheme,
    });
    button.disabled = false;
    i18n.onChange(() => labelTheme(theme.mode));
  </script>
  <script src="sounds.js?v=@hash@"></script>
  <script src="lobby.js?v=@hash@"></script>
  <script src="game.js?v=@hash@"></script>
</body>
</html>
