services:
  tower:
    build:
      context: .
      # The build host may keep containers from reaching NuGet over the bridge
      network: host
    image: truck-kun-tower
    container_name: truck-kun-tower
    ports:
      - "5184:8080"
    environment:
      ConnectionStrings__Default: "Data Source=/data/duel.db"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__PublicUrl: ${TELEGRAM_PUBLIC_URL:-}
      Telegram__AppLink: ${TELEGRAM_APP_LINK:-}
      Telegram__ApiAddress: ${TELEGRAM_API_ADDRESS:-}
    volumes:
      - tower-data:/data
    restart: unless-stopped

volumes:
  tower-data:
