services:
  tower:
    image: truck-kun-tower
    container_name: truck-kun-tower
    # The reverse proxy reaches the game on the loopback address, so nothing else listens on it
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:5184
      ConnectionStrings__Default: "Data Source=/data/duel.db"
    volumes:
      - tower-data:/data
    restart: unless-stopped

volumes:
  tower-data:
