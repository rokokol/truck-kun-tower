# tower.rokokol.art behind Cloudflare.
#
# Cloudflare terminates visitor TLS and reaches this server over plain HTTP on port 80, so the
# SSL/TLS mode of the zone has to be Flexible. Port 443 on this host belongs to the VPN.
#
# The 8443 listener is the same game over TLS, for a client that can reach a non-standard port.
# In Russia such connections are filtered by name, so the proxied port 80 is the way visitors come.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name tower.rokokol.art;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		proxy_pass http://127.0.0.1:5184;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}

server {
	listen 8443 ssl;
	server_name tower.rokokol.art;

	ssl_certificate /etc/letsencrypt/live/tower.rokokol.art/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/tower.rokokol.art/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	location / {
		proxy_pass http://127.0.0.1:5184;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}
